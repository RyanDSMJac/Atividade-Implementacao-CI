name: CI Pipeline - API de Tarefas (TypeScript)

# 1. Gatilho: executa sempre que houver um Pull Request para main ou develop
on:
  pull_request:
    branches:
      - main
      - develop

# Cancela execuções antigas do mesmo PR quando um novo commit é enviado
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Princípio do menor privilégio
permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  # ---------------------------------------------------------------
  # 2. Análise estática de código + 3. Análise de formatação
  # ---------------------------------------------------------------
  qualidade:
    name: Qualidade (Lint, Formatação e Tipos)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Análise estática de código (ESLint)
        run: npm run lint

      - name: Análise de formatação (Prettier)
        run: npm run format:check

      - name: Checagem de tipos (TypeScript)
        run: npm run typecheck

  # ---------------------------------------------------------------
  # 4. Análise estática de segurança (SAST + dependências)
  # ---------------------------------------------------------------
  seguranca:
    name: Segurança (CodeQL + npm audit)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # necessário para o CodeQL publicar resultados
      actions: read
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Inicializar CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript

      - name: Analisar com CodeQL (SAST)
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:javascript-typescript'

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Auditar dependências (vulnerabilidades conhecidas)
        run: npm audit --omit=dev --audit-level=high

  # ---------------------------------------------------------------
  # 5. Build
  # ---------------------------------------------------------------
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: qualidade
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Compilar TypeScript
        run: npm run build

      - name: Publicar artefato do build
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 3

  # ---------------------------------------------------------------
  # 6. Teste unitário (sem banco, repositório em memória)
  # ---------------------------------------------------------------
  teste-unitario:
    name: Testes Unitários
    runs-on: ubuntu-latest
    needs: qualidade
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Executar testes unitários com cobertura
        run: npm run test:unit

      - name: Publicar relatório de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage
          retention-days: 3

  # ---------------------------------------------------------------
  # 7. Teste de integração (API + PostgreSQL real via service container)
  # ---------------------------------------------------------------
  teste-integracao:
    name: Testes de Integração (PostgreSQL)
    runs-on: ubuntu-latest
    needs: qualidade
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tasks
        ports:
          - 5432:5432
        # Só inicia os passos quando o banco estiver saudável
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/tasks
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Executar testes de integração
        run: npm run test:integration

  # ---------------------------------------------------------------
  # 8. Criação da imagem Docker (só após todas as validações)
  # ---------------------------------------------------------------
  imagem-docker:
    name: Criação da Imagem Docker
    runs-on: ubuntu-latest
    needs: [seguranca, build, teste-unitario, teste-integracao]
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Em PRs apenas construímos para validar; o push real ocorre na branch main (CD)
      - name: Construir imagem Docker
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: tasks-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
